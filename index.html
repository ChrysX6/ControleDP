<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle do Departamento Pessoal — Águia Contab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <img src="https://chrysx6.github.io/LinksAguiaContab/links/img/logo1.jpg" alt="Águia Contab" class="logo-fixed">
  <h1>Controle do Departamento Pessoal</h1>
</header>

<div class="app-layout">

  <!-- SIDEBAR DE MESES -->
  <aside class="sidebar">
    <h3>Meses</h3>
    <ul id="monthList" class="month-list"></ul>
    <button id="addMonthBtn" class="btn btn-add-month">+ Novo Mês</button>

    <h3 class="historico-titulo">Últimas Empresas</h3>
    <ul id="historicoList" class="historico-list"></ul>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="content">

    <nav class="tabs" id="controlTabs">
      <button class="tab-btn active" data-control="FolhaPagamento">Folha de Pagamento</button>
      <button class="tab-btn" data-control="ProLabore">Pró-Labore</button>
      <button class="tab-btn" data-control="FolhaDomestica">Folha Doméstica</button>
      <button class="tab-btn" data-control="ControleSindical">Controle Sindical</button>
      <button class="tab-btn" data-control="EmpregadorWeb">Empregador Web</button>
    </nav>

    <div class="toolbar">
      <button id="addRowBtn" class="btn btn-primary">+ Adicionar</button>
      <button id="exportCsvBtn" class="btn btn-secondary">Exportar CSV</button>
      <button id="exportPdfBtn" class="btn btn-secondary">Exportar PDF</button>
      <input type="text" id="searchInput" placeholder="Pesquisar..." class="search-box">
      <span id="loadingIndicator" class="loading-indicator" style="display:none;">Sincronizando...</span>
    </div>

    <div class="table-wrapper">
      <table id="dataTable">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- MODAL DE EDIÇÃO/ADIÇÃO -->
<div id="rowModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modalTitle">Adicionar Registro</h3>
    <div id="modalFields" class="modal-fields"></div>
    <div class="modal-actions">
      <button id="saveRowBtn" class="btn btn-primary">Salvar</button>
      <button id="cancelRowBtn" class="btn btn-secondary">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL NOVO MÊS -->
<div id="monthModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Criar Novo Mês</h3>
    <p>O próximo mês será criado automaticamente com base no último existente.</p>
    <div class="modal-actions">
      <button id="confirmMonthBtn" class="btn btn-primary">Confirmar</button>
      <button id="cancelMonthBtn" class="btn btn-secondary">Cancelar</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
